<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PATHOGEN // 感染拡大シミュレーター</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root{
  --bg:#080b0a;
  --panel:#0f1512;
  --panel-2:#131c17;
  --line:#1f2e26;
  --line-bright:#2c4536;
  --ink:#d9e8e0;
  --ink-dim:#7d9488;
  --ink-faint:#4a5a51;
  --path:#4fd1ae;
  --path-glow:#8ff5d4;
  --danger:#e2453c;
  --danger-glow:#ff6b5e;
  --amber:#e8b23d;
  --font-head:'Oswald', sans-serif;
  --font-body:'JetBrains Mono', monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  height:100%;
  overflow:hidden;
}
body{
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(79,209,174,0.06), transparent 60%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
}
#app{
  display:flex;
  flex-direction:column;
  height:100vh;
  width:100vw;
}

/* ---------- HEADER ---------- */
header{
  display:flex;
  align-items:center;
  gap:18px;
  padding:10px 18px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, var(--panel), var(--bg));
  flex-shrink:0;
  flex-wrap:wrap;
}
.logo{
  font-family:var(--font-head);
  font-weight:700;
  font-size:20px;
  letter-spacing:3px;
  color:var(--ink);
  white-space:nowrap;
}
.logo b{color:var(--path); text-shadow:0 0 12px rgba(79,209,174,0.5);}
.hud{display:flex; align-items:center; gap:16px; margin-left:auto; flex-wrap:wrap;}
.hud-item{display:flex; flex-direction:column; align-items:flex-end; min-width:70px;}
.hud-label{font-size:9px; letter-spacing:2px; color:var(--ink-faint); text-transform:uppercase;}
.hud-value{font-size:16px; font-weight:600; color:var(--ink);}
.hud-value.dna{color:var(--path);}
.hud-value.cure{color:var(--amber);}
.speed-controls{display:flex; gap:4px; align-items:center; border-left:1px solid var(--line); padding-left:16px;}
.speed-btn{
  background:var(--panel-2); border:1px solid var(--line); color:var(--ink-dim);
  font-family:var(--font-body); font-size:11px; padding:6px 10px; cursor:pointer; border-radius:2px;
  transition:all .15s;
}
.speed-btn:hover{border-color:var(--line-bright); color:var(--ink);}
.speed-btn.active{background:rgba(79,209,174,0.15); border-color:var(--path); color:var(--path);}

/* ---------- MAIN LAYOUT ---------- */
main{
  flex:1;
  display:grid;
  grid-template-columns:1fr 320px;
  overflow:hidden;
  min-height:0;
}
.map-col{
  display:flex;
  flex-direction:column;
  min-width:0;
  border-right:1px solid var(--line);
}
.map-wrap{
  flex:1;
  position:relative;
  min-height:0;
  background:radial-gradient(ellipse at 50% 45%, #0d1512 0%, #060807 75%);
}
#mapSvg{width:100%; height:100%; display:block;}
.country{fill:#1a2620; stroke:#080b0a; stroke-width:.4; transition:fill .5s ease; cursor:default;}
.country.selectable{cursor:crosshair;}
.country.selectable:hover{fill:#2a3d33 !important; stroke:var(--path); stroke-width:1;}
.blip{pointer-events:none;}
.blip circle{animation:pulse 1.8s ease-in-out infinite;}
@media (prefers-reduced-motion: reduce){ .blip circle{animation:none;} }
@keyframes pulse{
  0%{opacity:.85; transform:scale(0.9);}
  50%{opacity:.25; transform:scale(1.6);}
  100%{opacity:.85; transform:scale(0.9);}
}
.map-caption{
  position:absolute; top:10px; left:14px; font-size:10px; letter-spacing:2px; color:var(--ink-faint);
  text-transform:uppercase; pointer-events:none;
}
.origin-prompt{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:10px; pointer-events:none; background:rgba(6,8,7,0.35);
}
.origin-prompt span{
  font-family:var(--font-head); font-size:22px; letter-spacing:2px; color:var(--path-glow);
  text-shadow:0 0 16px rgba(79,209,174,0.6); background:rgba(8,11,10,0.75); padding:10px 22px; border:1px solid var(--line-bright);
}

/* ---------- STAT BARS / NEWS ---------- */
.footer-panel{
  border-top:1px solid var(--line);
  background:var(--panel);
  padding:10px 16px;
  flex-shrink:0;
}
.stat-bars{display:flex; gap:14px; margin-bottom:8px;}
.stat-block{flex:1;}
.stat-top{display:flex; justify-content:space-between; font-size:10px; letter-spacing:1px; margin-bottom:3px; color:var(--ink-dim);}
.stat-top b{font-size:12px; font-weight:600;}
.bar-track{height:7px; background:#131c17; border:1px solid var(--line); border-radius:3px; overflow:hidden; display:flex;}
.bar-fill{height:100%; transition:width .5s ease;}
.bar-fill.healthy{background:linear-gradient(90deg,#3a5a4a,#4fd1ae);}
.bar-fill.infected{background:linear-gradient(90deg,#c9962f,#e8b23d);}
.bar-fill.dead{background:linear-gradient(90deg,#8f2a24,#e2453c);}
.news-line{
  font-size:11px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  border-top:1px dashed var(--line); padding-top:7px; display:flex; gap:8px; align-items:center;
}
.news-line .tag{color:var(--path); font-weight:600; flex-shrink:0;}
.news-line.danger .tag{color:var(--danger);}
.news-line.amber .tag{color:var(--amber);}

/* ---------- SIDEBAR ---------- */
.sidebar{
  display:flex; flex-direction:column; background:var(--panel); min-height:0;
}
.tabs{display:flex; border-bottom:1px solid var(--line); flex-shrink:0;}
.tab-btn{
  flex:1; padding:10px 4px; text-align:center; font-family:var(--font-head); font-size:12px;
  letter-spacing:1.5px; color:var(--ink-faint); background:none; border:none; cursor:pointer;
  border-bottom:2px solid transparent; text-transform:uppercase;
}
.tab-btn.active{color:var(--path); border-bottom-color:var(--path);}
.trait-scroll{flex:1; overflow-y:auto; padding:12px; min-height:0;}
.trait-scroll::-webkit-scrollbar{width:6px;}
.trait-scroll::-webkit-scrollbar-thumb{background:var(--line-bright); border-radius:3px;}
.trait-tier-label{font-size:9px; letter-spacing:2px; color:var(--ink-faint); margin:12px 0 6px; text-transform:uppercase;}
.trait-tier-label:first-child{margin-top:0;}
.trait-node{
  border:1px solid var(--line); background:var(--panel-2); border-radius:3px; padding:8px 10px; margin-bottom:6px;
  cursor:pointer; transition:all .15s;
}
.trait-node:hover:not(.owned):not(.locked){border-color:var(--path); background:rgba(79,209,174,0.06);}
.trait-node.owned{border-color:var(--path); background:rgba(79,209,174,0.1); cursor:default;}
.trait-node.locked{opacity:.35; cursor:not-allowed;}
.trait-top{display:flex; justify-content:space-between; align-items:center; gap:6px;}
.trait-name{font-size:12.5px; font-weight:600; color:var(--ink);}
.trait-node.owned .trait-name{color:var(--path);}
.trait-cost{font-size:11px; color:var(--path); font-weight:600; flex-shrink:0;}
.trait-node.owned .trait-cost{color:var(--ink-faint);}
.trait-desc{font-size:10.5px; color:var(--ink-dim); margin-top:4px; line-height:1.4;}
.trait-effects{display:flex; gap:6px; margin-top:5px; flex-wrap:wrap;}
.eff{font-size:9px; padding:1px 6px; border-radius:8px; border:1px solid var(--line-bright); color:var(--ink-dim);}

/* ---------- MODALS ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(4,5,5,0.88); display:flex; align-items:center; justify-content:center;
  z-index:50; padding:20px;
}
.modal-overlay.hidden{display:none;}
.modal{
  background:var(--panel); border:1px solid var(--line-bright); border-radius:6px; padding:30px 34px;
  max-width:560px; width:100%; max-height:88vh; overflow-y:auto;
  box-shadow:0 0 60px rgba(79,209,174,0.08);
}
.modal h1{
  font-family:var(--font-head); font-size:28px; letter-spacing:3px; color:var(--ink);
  text-align:center; margin-bottom:4px;
}
.modal h1 b{color:var(--path); text-shadow:0 0 20px rgba(79,209,174,0.5);}
.modal .sub{text-align:center; color:var(--ink-faint); font-size:11px; letter-spacing:2px; margin-bottom:24px; text-transform:uppercase;}
.field{margin-bottom:18px;}
.field label{display:block; font-size:10px; letter-spacing:2px; color:var(--ink-dim); text-transform:uppercase; margin-bottom:8px;}
.field input[type=text]{
  width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--ink); padding:9px 10px;
  font-family:var(--font-body); font-size:13px; border-radius:3px;
}
.field input[type=text]:focus{outline:none; border-color:var(--path);}
.type-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.type-card{
  border:1px solid var(--line); background:var(--panel-2); border-radius:4px; padding:10px 12px; cursor:pointer; transition:all .15s;
}
.type-card:hover{border-color:var(--line-bright);}
.type-card.sel{border-color:var(--path); background:rgba(79,209,174,0.08);}
.type-card .tname{font-family:var(--font-head); font-size:14px; letter-spacing:1px; color:var(--ink);}
.type-card .tdesc{font-size:10px; color:var(--ink-dim); margin-top:3px; line-height:1.4;}
.start-btn{
  width:100%; margin-top:10px; background:linear-gradient(180deg, rgba(79,209,174,0.2), rgba(79,209,174,0.08));
  border:1px solid var(--path); color:var(--path-glow); font-family:var(--font-head); font-size:16px; letter-spacing:3px;
  padding:13px; border-radius:4px; cursor:pointer; text-transform:uppercase; transition:all .15s;
}
.start-btn:hover{background:rgba(79,209,174,0.3); box-shadow:0 0 20px rgba(79,209,174,0.25);}
.start-btn:disabled{opacity:.4; cursor:not-allowed; box-shadow:none;}

.end-result{font-family:var(--font-head); font-size:32px; text-align:center; letter-spacing:2px; margin-bottom:6px;}
.end-result.win{color:var(--path-glow); text-shadow:0 0 20px rgba(79,209,174,0.6);}
.end-result.lose{color:var(--danger-glow); text-shadow:0 0 20px rgba(226,69,60,0.6);}
.end-sub{text-align:center; color:var(--ink-dim); font-size:12px; margin-bottom:22px; line-height:1.6;}
.end-stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px;}
.end-stat{background:var(--panel-2); border:1px solid var(--line); border-radius:4px; padding:12px; text-align:center;}
.end-stat .v{font-size:20px; font-weight:700; color:var(--ink);}
.end-stat .l{font-size:9px; letter-spacing:1px; color:var(--ink-faint); text-transform:uppercase; margin-top:3px;}

@media (max-width:820px){
  main{grid-template-columns:1fr;}
  .sidebar{border-top:1px solid var(--line); max-height:38vh;}
  .map-col{border-right:none;}
  .hud{gap:10px;}
  .hud-item{min-width:52px;}
}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo">PATHO<b>GEN</b></div>
    <div class="hud">
      <div class="hud-item"><span class="hud-label">Day</span><span class="hud-value" id="hudDay">0</span></div>
      <div class="hud-item"><span class="hud-label">DNA Points</span><span class="hud-value dna" id="hudDna">0</span></div>
      <div class="hud-item"><span class="hud-label">Cure Research</span><span class="hud-value cure" id="hudCure">0%</span></div>
      <div class="speed-controls">
        <button class="speed-btn" id="btnPause">II</button>
        <button class="speed-btn active" data-speed="1">1x</button>
        <button class="speed-btn" data-speed="2">2x</button>
        <button class="speed-btn" data-speed="4">4x</button>
        <button class="speed-btn" data-speed="8">8x</button>
      </div>
    </div>
  </header>

  <main>
    <div class="map-col">
      <div class="map-wrap">
        <div class="map-caption">GLOBAL OUTBREAK MONITOR</div>
        <svg id="mapSvg" viewBox="0 0 960 500" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="origin-prompt hidden" id="originPrompt"><span>感染源とする国を地図上でクリック</span></div>
      </div>
      <div class="footer-panel">
        <div class="stat-bars">
          <div class="stat-block">
            <div class="stat-top"><span>健常者</span><b id="pctHealthy">100%</b></div>
            <div class="bar-track"><div class="bar-fill healthy" id="barHealthy" style="width:100%"></div></div>
          </div>
          <div class="stat-block">
            <div class="stat-top"><span>感染者</span><b id="pctInfected">0%</b></div>
            <div class="bar-track"><div class="bar-fill infected" id="barInfected" style="width:0%"></div></div>
          </div>
          <div class="stat-block">
            <div class="stat-top"><span>死者</span><b id="pctDead">0%</b></div>
            <div class="bar-track"><div class="bar-fill dead" id="barDead" style="width:0%"></div></div>
          </div>
        </div>
        <div class="news-line" id="newsLine"><span class="tag">STANDBY</span><span>病原体の設定を待機中...</span></div>
      </div>
    </div>

    <div class="sidebar">
      <div class="tabs">
        <button class="tab-btn active" data-tab="transmission">感染経路</button>
        <button class="tab-btn" data-tab="symptom">症状</button>
        <button class="tab-btn" data-tab="ability">能力</button>
      </div>
      <div class="trait-scroll" id="traitScroll"></div>
    </div>
  </main>

</div>

<!-- CONFIG MODAL -->
<div class="modal-overlay" id="configModal">
  <div class="modal">
    <h1>PATHO<b>GEN</b></h1>
    <div class="sub">病原体を設計し、人類の滅亡を目指せ</div>
    <div class="field">
      <label>病原体の名称</label>
      <input type="text" id="pathogenName" placeholder="例: クリムゾン・フィーバー" maxlength="24">
    </div>
    <div class="field">
      <label>病原体タイプ</label>
      <div class="type-grid" id="typeGrid"></div>
    </div>
    <button class="start-btn" id="btnStart">病原体を発生させる</button>
  </div>
</div>

<!-- END MODAL -->
<div class="modal-overlay hidden" id="endModal">
  <div class="modal">
    <div class="end-result" id="endTitle">-</div>
    <div class="end-sub" id="endSub">-</div>
    <div class="end-stats">
      <div class="end-stat"><div class="v" id="endDay">0</div><div class="l">経過日数</div></div>
      <div class="end-stat"><div class="v" id="endDead">0</div><div class="l">総死者数</div></div>
      <div class="end-stat"><div class="v" id="endInfected">0</div><div class="l">感染国数</div></div>
      <div class="end-stat"><div class="v" id="endCure">0%</div><div class="l">治療薬完成度</div></div>
    </div>
    <button class="start-btn" id="btnRestart">再挑戦する</button>
  </div>
</div>

===================================================================== */
const svg = d3.select("#mapSvg");
const gCountries = svg.append("g").attr("class","g-countries");
const gBlips = svg.append("g").attr("class","g-blips");
const projection = d3.geoNaturalEarth1();
const path = d3.geoPath(projection);

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(topology=>{
  const objName = topology.objects.countries ? "countries" : Object.keys(topology.objects)[0];
  const geometries = topology.objects[objName].geometries;
  const fc = topojson.feature(topology, topology.objects[objName]);
  projection.fitSize([960,500], fc);

  const neighborIdx = topojson.neighbors(geometries);

  state.countries = fc.features.map((feature, i)=>{
    const name = (feature.properties && (feature.properties.name || feature.properties.NAME)) || ("Region "+i);
    const [pop, wealth] = popWealth(name);
    let centroid = [0,0];
    try{ centroid = projection(d3.geoCentroid(feature)); }catch(e){}
    if(!centroid || isNaN(centroid[0])) centroid=[480,250];
    return {
      idx:i, name, feature, population: pop, wealth,
      healthy: pop, infected:0, dead:0, immune:0,
      awareness:0, quarantine:0, detected:false,
      centroid, neighbors: neighborIdx[i] || []
    };
  });
  state.totalPop = state.countries.reduce((s,c)=>s+c.population,0);

  // build air-hub network: top 26 by population*wealth
  const ranked = [...state.countries].sort((a,b)=> (b.population*(0.4+b.wealth)) - (a.population*(0.4+a.wealth)));
  state.hubIdx = ranked.slice(0,26).map(c=>c.idx);

  // render paths
  gCountries.selectAll("path.country")
    .data(state.countries)
    .join("path")
    .attr("class","country")
    .attr("d", d=>path(d.feature))
    .attr("data-idx", d=>d.idx)
    .on("click", (ev,d)=> onCountryClick(d));

  // blip layer placeholders
  gBlips.selectAll("g.blip")
    .data(state.countries)
    .join("g")
    .attr("class","blip")
    .attr("transform", d=>`translate(${d.centroid[0]},${d.centroid[1]})`)
    .append("circle")
    .attr("r",0)
    .attr("fill", "var(--danger)");

}).catch(err=>{
  addNews("ERROR","地図データの取得に失敗しました。ネットワーク設定を確認してください。","danger");
  console.error(err);
});

function startInfection(country){
  state.phase = "playing";
  document.getElementById("originPrompt").classList.add("hidden");
  document.querySelectorAll(".country").forEach(p=>p.classList.remove("selectable"));
  const seed = Math.max(3, Math.round(country.population*0.00005*1000));
  country.infected = Math.min(country.population, seed/1000 + 0.002);
  country.healthy -= country.infected;
  addNews("OUTBREAK", `${country.name} で患者ゼロが確認されました。`, "danger");
  recomputeStats();
}

/* =====================================================================
   TRAIT PURCHASE / STATS
===================================================================== */
function ownedCountByTier(cat, tier){
  return TRAITS.filter(t=>t.cat===cat && t.tier===tier && state.owned[t.id]).length;
}
function traitLocked(t){
  if(!t.req) return false;
  if(t.req.startsWith("tier")){
    const [,tierN, need] = t.req.match(/tier(\d):(\d)/) ? [null, t.req.match(/tier(\d):(\d)/)[1], t.req.match(/tier(\d):(\d)/)[2]] : [null,0,0];
    return ownedCountByTier(t.cat, parseInt(tierN)) < parseInt(need);
  }
  return !state.owned[t.req];
}
function traitCostFor(t){
  const mult = (state.typeObj && state.typeObj.costMult && state.typeObj.costMult[t.cat]) || 1;
  return Math.round(t.cost * mult);
}
function buyTrait(id){
  const t = TRAITS.find(x=>x.id===id);
  if(!t || state.owned[id] || traitLocked(t)) return;
  const cost = traitCostFor(t);
  if(state.dna < cost) return;
  state.dna -= cost;
  state.owned[id] = true;
  recomputeStats();
  addNews("EVOLVE", `新形質「${t.name}」を獲得しました。`, "amber");
  renderTraitTab();
  updateHud();
}
function recomputeStats(){
  const type = state.typeObj;
  const base = Object.assign({infectivity:1, severity:1, lethality:0.5, cureResistance:0, detect:0, quarantineResist:0, dnaGainMult:1}, type ? type.base : {});
  const s = {infectivity:base.infectivity, severity:base.severity, lethality:base.lethality, cureResistance:base.cureResistance,
             detect: type ? (type.detectStart||0) : 0, quarantineResist: type ? (type.quarantineResistStart||0) : 0, dnaGainMult:1};
  TRAITS.forEach(t=>{
    if(state.owned[t.id]){
      for(const k in t.fx) s[k] = (s[k]||0) + t.fx[k];
    }
  });
  s.dnaGainMult += (type ? (type.dnaMult-1) : 0);
  s.lethality = Math.max(0.05, s.lethality);
  s.infectivity = Math.max(0.1, s.infectivity);
  s.cureResistance = Math.max(-3, s.cureResistance);
  state.stats = s;
  state.cureThreshold = 100 + Math.max(0, s.cureResistance)*38 - Math.min(0,s.cureResistance)*10;
}

function renderTraitTab(){
  const wrap = document.getElementById("traitScroll");
  wrap.innerHTML = "";
  const list = TRAITS.filter(t=>t.cat===currentTab).sort((a,b)=>a.tier-b.tier || a.cost-b.cost);
  let lastTier = null;
  list.forEach(t=>{
    if(t.tier !== lastTier){

      wrap.appendChild(lbl);
      lastTier = t.tier;

    node.className = "trait-node" + (owned?" owned":"") + (locked?" locked":"");
    const effHtml = Object.keys(t.fx).map(k=>`<span class="eff">${EFF_LABEL[k]||k} ${t.fx[k]>0?"+":""}${t.fx[k]}</span>`).join("");
    node.innerHTML = `<div class="trait-top"><span class="trait-name">${t.name}</span><span class="trait-cost">${owned?"習得済":cost+" DNA"}</span></div>
      <div class="trait-desc">${t.desc}</div><div class="trait-effects">${effHtml}</div>`;
    if(!owned && !locked){
      node.addEventListener("click", ()=>buyTrait(t.id));

  });

/* =====================================================================
   SIMULATION TICK
===================================================================== */
function tick(){
  const s = state.stats;
  let globalInfectedCountries = 0;
  let researchGain = 0;

  state.countries.forEach(c=>{
    if(c.population<=0) return;
    if(c.infected<=0.0001 && !c.detected){ return; }

    const infFrac = c.infected / c.population;

    // local spread
    if(c.infected>0){
      const forceOfInfection = 1 - Math.exp(-(s.infectivity*0.09) * infFrac);
      const quarantineEffect = Math.max(0, c.quarantine*(1-s.quarantineResist));
      let newly = c.healthy * forceOfInfection * (1-quarantineEffect*0.85);
      newly = Math.min(newly, c.healthy);
      if(newly>0){
        c.healthy -= newly;
        c.infected += newly;
      }

      // deaths
      const healthcareMitigation = c.wealth*0.55;
      let deaths = c.infected * (s.lethality*0.0016) * (1-healthcareMitigation);
      deaths = Math.min(deaths, c.infected);
      c.infected -= deaths;
      c.dead += deaths;

      // cure recoveries
      if(state.cureFound){
        let rec = c.infected * 0.045;
        rec = Math.min(rec, c.infected);
        c.infected -= rec;
        c.immune += rec;
      }

      // awareness
      c.awareness = Math.min(1, c.awareness + (s.severity*0.0022 + infFrac*0.012) * Math.max(0.15, (1-Math.max(0,-s.detect)*0.05)) + Math.max(0,s.detect)*0.0009);
      if(!c.detected && c.awareness>0.18){
        c.detected = true;
        addNews("警戒", `${c.name} で感染爆発が確認され、警戒レベルが引き上げられました。`, "danger");
      }
      if(c.awareness>0.35){
        c.quarantine = Math.min(1, c.quarantine + 0.018);
      }
      if(c.detected){
        researchGain += c.wealth * Math.log(1+c.population) * 0.052;
        globalInfectedCountries++;
      }
    }
  });

  // cross-country spread
  if(!state.cureFound){
    state.countries.forEach(c=>{
      if(c.infected<=0) return;
      const infFrac = c.infected/c.population;
      const outQ = Math.max(0, c.quarantine*(1-s.quarantineResist));
      // land neighbors
      c.neighbors.forEach(ni=>{
        const b = state.countries[ni];
        if(!b || b.infected>0.001) return;
        const inQ = Math.max(0, b.quarantine*(1-s.quarantineResist));
        const p = infFrac * s.infectivity * 0.028 * (1-outQ*0.8) * (1-inQ*0.8);
        if(Math.random() < p){
          seedCountry(b, c);
        }
      });
    });
    // air hubs
    state.hubIdx.forEach(hi=>{
      const h = state.countries[hi];
      if(!h || h.infected<=0) return;
      const infFrac = h.infected/h.population;
      const outQ = Math.max(0, h.quarantine*(1-s.quarantineResist));
      state.hubIdx.forEach(hj=>{
        if(hi===hj) return;
        const b = state.countries[hj];
        if(!b || b.infected>0.001) return;
        const inQ = Math.max(0, b.quarantine*(1-s.quarantineResist));
        const p = infFrac * s.infectivity * 0.02 * (1-outQ*0.85) * (1-inQ*0.85) * (0.3+b.wealth);
        if(Math.random() < p){
          seedCountry(b, h);
        }
      });
      // hub -> random small country occasionally
      if(Math.random() < infFrac*s.infectivity*0.01*(1-outQ)){
        const target = state.countries[Math.floor(Math.random()*state.countries.length)];
        if(target && target.infected<=0.001){
          seedCountry(target, h);
        }
      }
    });
  }

  // global research
  if(!state.cureFound){
    state.cureProgress += researchGain;
    if(state.cureProgress >= state.cureThreshold){
      state.cureFound = true;
      addNews("治療薬完成", "世界保健機関が治療薬の開発に成功しました。感染者の回復が始まります。", "amber");
    }
  }

  // DNA gain
  const dnaGain = (0.35 + globalInfectedCountries*0.045) * s.dnaGainMult;
  state.dna += dnaGain;
  if(Math.random() < 0.012){
    const bonus = 4 + Math.random()*6;
    state.dna += bonus;
    addNews("変異", "病原体が自然突然変異を起こし、追加のDNAポイントを獲得しました。", "amber");
  }

  state.day++;
}

function seedCountry(target, source){
  const seed = Math.max(0.001, target.population*0.00003);
  target.infected = seed;
  target.healthy -= seed;
  if(target.healthy<0) target.healthy=0;
  addNews("拡散", `${source.name} から ${target.name} へ感染が拡大しました。`, "danger");
}

/* =====================================================================
   RENDER
===================================================================== */
function colorFor(c){
  if(c.population<=0) return "#1a2620";
  const infFrac = c.infected/c.population;
  const deadFrac = c.dead/c.population;
  if(deadFrac>0.01){
    const t = Math.min(1, deadFrac*3);
    return d3.interpolateRgb("#5c2a24", "#e2453c")(t);
  }
  if(infFrac>0.0005){
    const t = Math.min(1, infFrac*4);
    return d3.interpolateRgb("#2c3d2a", "#e8b23d")(t);
  }
  return "#1a2620";
}

function render(){
  gCountries.selectAll("path.country").attr("fill", d=>colorFor(d));
  gBlips.selectAll("g.blip circle")
    .attr("r", d=> d.infected>0.0005 ? Math.min(9, 2+Math.sqrt(d.infected)*0.6) : 0)
    .attr("fill", d=> d.dead/d.population>0.03 ? "var(--danger)" : "var(--amber)");

  updateHud();

  let totH=0, totI=0, totD=0;
  state.countries.forEach(c=>{ totH+=c.healthy; totI+=c.infected; totD+=c.dead; });
  const tot = state.totalPop || 1;
  document.getElementById("pctHealthy").textContent = ((totH/tot)*100).toFixed(1)+"%";
  document.getElementById("pctInfected").textContent = ((totI/tot)*100).toFixed(2)+"%";
  document.getElementById("pctDead").textContent = ((totD/tot)*100).toFixed(2)+"%";
  document.getElementById("barHealthy").style.width = ((totH/tot)*100)+"%";
  document.getElementById("barInfected").style.width = ((totI/tot)*100)+"%";
  document.getElementById("barDead").style.width = ((totD/tot)*100)+"%";

  checkEnd(totH, totI, totD, tot);
}

function updateHud(){
  document.getElementById("hudDay").textContent = state.day;
  document.getElementById("hudDna").textContent = Math.floor(state.dna);
  document.getElementById("hudCure").textContent = state.cureFound ? "完成" : Math.min(100, Math.round((state.cureProgress/state.cureThreshold)*100))+"%";
}

/* =====================================================================
   END CONDITIONS
===================================================================== */
function checkEnd(totH, totI, totD, tot){
  if(state.phase !== "playing") return;
  if(totD >= tot*0.995){
    endGame(true, "human_extinct", totD, totI, tot);
    return;
  }
  if(state.cureFound && (totI+totH) > 0 && (totH/tot) > 0.0005){
    // cure is active; if infected pool has fully drained and healthy remains, it's a loss
    if(totI < tot*0.00002 && state.day>3){
      endGame(false, "cured", totD, totI, tot);
      return;
    }
  }
  if(state.day>6 && totI < 0.001 && totD < tot*0.001 && !state.cureFound){
    endGame(false, "diedout", totD, totI, tot);
    return;
  }
}

function endGame(win, reason, totD, totI, tot){
  state.phase = "ended";
  const infectedCountries = state.countries.filter(c=>c.detected).length;
  const titleEl = document.getElementById("endTitle");
  const subEl = document.getElementById("endSub");
  if(win){
    titleEl.textContent = "人類絶滅完了";
    titleEl.className = "end-result win";
    subEl.textContent = `${state.pathogenName} は ${state.day} 日間で人類を滅ぼしました。`;
  } else {
    titleEl.textContent = "根絶失敗";
    titleEl.className = "end-result lose";
    if(reason==="cured") subEl.textContent = "世界各国が協力して治療薬を完成させ、病原体は根絶されました。";
    else subEl.textContent = "病原体は十分に拡散する前に感染連鎖が途絶えました。";
  }
  document.getElementById("endDay").textContent = state.day;
  document.getElementById("endDead").textContent = Math.round(totD).toLocaleString();
  document.getElementById("endInfected").textContent = infectedCountries;
  document.getElementById("endCure").textContent = state.cureFound ? "100%" : Math.round((state.cureProgress/state.cureThreshold)*100)+"%";
  document.getElementById("endModal").classList.remove("hidden");
}

document.getElementById("btnRestart").addEventListener("click", ()=>{
  location.reload();
});

/* =====================================================================
   GAME LOOP / SPEED CONTROLS
===================================================================== */
document.querySelectorAll(".speed-btn[data-speed]").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".speed-btn[data-speed]").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    state.speed = parseInt(btn.dataset.speed);
    state.paused = false;
    document.getElementById("btnPause").classList.remove("active");
  });
});
document.getElementById("btnPause").addEventListener("click", (e)=>{
  state.paused = !state.paused;
  e.target.classList.toggle("active", state.paused);
});

setInterval(()=>{
  if(state.phase !== "playing" || state.paused) return;
  for(let i=0;i<state.speed;i++){ tick(); }
  render();
}, 320);

</script>
</body>
